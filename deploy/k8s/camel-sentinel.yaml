# CAMEL Sentinel on Kubernetes: 3 replicas behind one Service.
#   kubectl create secret generic camel-secrets --from-env-file=.env   # optional (chat/voice)
#   kubectl apply -f deploy/k8s/camel-sentinel.yaml
#   kubectl get pods -l app=camel-sentinel -w
# Works on AKS, minikube or Docker Desktop's built-in Kubernetes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camel-sentinel
  labels: { app: camel-sentinel }
spec:
  replicas: 3                          # K8s keeps 3 copies running and replaces any that die
  selector:
    matchLabels: { app: camel-sentinel }
  template:
    metadata:
      labels: { app: camel-sentinel }
    spec:
      securityContext:
        runAsNonRoot: true             # refuse to start if the image would run as root
        runAsUser: 10001
      containers:
        - name: camel-sentinel
          image: raushanranjan/camel-sentinel:latest
          ports:
            - { name: ui, containerPort: 8501 }
            - { name: api, containerPort: 8000 }
          envFrom:
            - secretRef: { name: camel-secrets, optional: true }
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits:   { cpu: "2",    memory: "4Gi" }
          readinessProbe:              # only send traffic once models are loaded
            httpGet: { path: /health, port: api }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:               # restart the pod if the API stops answering
            httpGet: { path: /health, port: api }
            initialDelaySeconds: 120
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: camel-sentinel
spec:
  type: LoadBalancer
  selector: { app: camel-sentinel }
  sessionAffinity: ClientIP            # Streamlit keeps session state per replica
  ports:
    - { name: ui, port: 80, targetPort: ui }
