# Two-container setup from ONE image: the API and the UI run as separate services.
#   docker compose up -d        → UI on http://localhost:8501, API on http://localhost:8000
#   docker compose down
# The UI reaches the API by its service name ("api"), not localhost — each
# container has its own network namespace. See docs/06_deployment_containerization.md.
services:
  api:
    image: raushanranjan/camel-sentinel:latest
    build: .
    environment:
      MODE: api
    env_file:
      - path: .env
        required: false        # chat/voice keys are optional
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    image: raushanranjan/camel-sentinel:latest
    environment:
      MODE: ui
      CAMEL_BACKEND_URL: http://api:8000
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
